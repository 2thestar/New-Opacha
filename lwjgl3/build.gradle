tasks.register('balancePlaytest', JavaExec) {
    group = 'verification'
    description = 'Compare delayed human-style strategies across modes and starting positions.'
    dependsOn tasks.named('installDist'), tasks.named('smokeTestClasses')
    timeout = java.time.Duration.ofSeconds(480)
    classpath = files(sourceSets.smokeTest.output, fileTree(layout.buildDirectory.dir('install/new-opacha/lib')))
    mainClass = 'yio.tro.opacha.lwjgl3.BalancePlaytest'
    workingDir rootProject.projectDir
    args layout.buildDirectory.dir('balance/' + providers.gradleProperty('labName').getOrElse('baseline')).get().asFile.absolutePath
    if (providers.gradleProperty('campaignLab').isPresent()) args 'campaign'
    ['labLevels','labSeeds','labSeedStart'].each { name ->
        if (providers.gradleProperty(name).isPresent()) systemProperty name, providers.gradleProperty(name).get()
    }
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
}

